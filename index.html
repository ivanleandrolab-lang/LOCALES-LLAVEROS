<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar de Locales</title>
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fontLink" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: app de una pantalla — barra superior, vista con scroll propio (o mapa a pantalla), pestañas abajo; ficha del local en hoja deslizable */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#1E2430; --muted:#6B7280; --line:#E2E5EA; --accent:#1F2937; --on-accent:#FFFFFF; --tile-filter:none;
  --s-sin_contactar:#9CA3AF; --s-no_contesta:#F97316; --s-en_conversacion:#3B82F6; --s-esperando_muestra:#EAB308; --s-muestra_entregada:#8B5CF6; --s-venta:#16A34A; --s-no_interesado:#DC2626;
  --wa:#1FA855; --on-wa:#FFFFFF; --warn:#C2410C;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:15px; --r:12px;
  color-scheme:light;
}
*,::before,::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{font-size:var(--fs)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.top{padding-block:12px 10px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.2rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.base{font-size:.78rem;color:var(--muted);text-align:right;min-width:0}
.base b{color:var(--ink);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 28px;display:flex;flex-direction:column;gap:20px}
#view>*,.sec>*,#sheet .panel>*{flex-shrink:0}
#view.compact{flex:none;overflow:visible;padding-block:10px;gap:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] svg{stroke-width:2.2}
.tabs svg{width:22px;height:22px}
h2{font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.warn{color:var(--warn);font-weight:700}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.75);padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:100px;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
label.ck{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
label.ck input{width:18px;height:18px;accent-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .wide{grid-column:1/-1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--r)*.75);padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font-size:.92rem}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.82rem}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.wa{background:var(--wa);color:var(--on-wa);border-color:transparent}
.btn.danger{color:var(--s-no_interesado)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(var(--r)*.75);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.full{display:flex}.seg.full button{flex:1}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:first-child{border-top:0}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item>div{min-width:0}
.item.sel{background:var(--sunk)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c,var(--s-sin_contactar));flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip .dot{width:9px;height:9px}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pipe button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pipe .n{font-weight:700;font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
.pipe .l{font-size:.72rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.pipe .l .dot{width:9px;height:9px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface)}
.empty p{max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.sitcard{border-left:4px solid var(--c)}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars button{font-family:var(--mono);font-size:.72rem;border:1px dashed var(--line);background:var(--sunk);border-radius:6px;padding:3px 7px;cursor:pointer}
.preview{background:var(--sunk);border-radius:calc(var(--r)*.75);padding:10px 12px;white-space:pre-wrap;font-size:.9rem;border-left:3px solid var(--wa)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:5px}
.tl div{padding:3px 0 10px 14px;position:relative;font-size:.85rem}
.tl div::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted));border:2px solid var(--bg)}
.tl .t{font-size:.72rem;color:var(--muted)}
.tl .x{white-space:pre-wrap;overflow-wrap:anywhere}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.hbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.hbar i{display:block;height:100%}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:118px 1fr 72px;gap:10px;align-items:center;font-size:.84rem}
.funnel .bar{height:20px;border-radius:5px;background:var(--sunk);overflow:hidden}
.funnel .bar i{display:block;height:100%;border-radius:5px;background:var(--c)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;font-weight:700}
th:first-child,td:first-child{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi .n{font-weight:700;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi .s{font-size:.74rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .dot{width:9px;height:9px}
.note{font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:calc(var(--r)*.75);padding:9px 11px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.stop{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.stop:first-child{border-top:0}
.stop .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;background:var(--c)}
.stop.done .no{background:var(--muted)}
.stop.done .nm{text-decoration:line-through;color:var(--muted)}
.stop .nm{font-weight:600}
.stop>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opts button{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.84rem}
.opts button[aria-pressed="true"]{border-color:var(--accent)}
.opts .sw{display:flex;gap:4px}
.opts .sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.opts .aa{font-size:1.35rem;font-weight:500;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
/* mapa */
#mapPane{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sunk)}
#map .tl-invert{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-size:.88rem}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.pop{display:flex;flex-direction:column;gap:8px;min-width:210px}
.mapbar{position:absolute;z-index:500;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.mapbar input,.mapbar .btn{box-shadow:0 2px 10px rgba(0,0,0,.14)}
.results{position:absolute;z-index:501;top:58px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.75);overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.16)}
.results button,.results div{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;font-size:.88rem}
.results button{cursor:pointer}
.results>:first-child{border-top:0}
.results b{font-weight:600}
.layers{position:absolute;z-index:500;left:max(10px,env(safe-area-inset-left,0px));bottom:26px;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px}
.layers>.btn{box-shadow:0 2px 10px rgba(0,0,0,.16)}
.lpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.lpanel button{border:2px solid transparent;border-radius:calc(var(--r)*.75);background:var(--sunk);padding:5px;font-weight:600;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:104px;color:var(--ink)}
.lpanel button[aria-pressed="true"]{border-color:var(--accent)}
.lpanel .sw{width:100%;height:46px;border-radius:6px;background:var(--line) center/cover no-repeat}
.rnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px/1 var(--font);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
/* hoja de detalle */
#sheet{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(15,20,30,.32)}
#sheet .panel{background:var(--bg);border-radius:18px 18px 0 0;max-height:93%;overflow-y:auto;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sh-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none;font-size:1.2rem;line-height:1}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.75);padding:9px 11px;font-size:.8rem;color:var(--muted)}
.sumgrid b{display:block;color:var(--ink);font-size:.95rem;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.edit-grid .wide{grid-column:1/-1}
@media (max-width:420px){.funnel .fr{grid-template-columns:96px 1fr 64px}}
@media (prefers-reduced-motion:no-preference){.btn,.item,.chip{transition:background-color .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div id="app">
  <header class="top gut">
    <div class="brand"><svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".3"/><circle cx="13" cy="13" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M13 13 L22 6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><circle cx="13" cy="13" r="2" fill="currentColor"/><circle cx="18" cy="17" r="2" fill="var(--s-venta)"/></svg>Radar de Locales</div>
    <div class="base" id="baseInfo"></div>
  </header>
  <main id="view" class="gut"></main>
  <div id="mapPane" hidden>
    <div id="map"></div>
    <form class="mapbar" id="mapSearch"><input type="search" id="mq" placeholder="Calle y altura, localidad" autocomplete="off" enterkeyhint="search"><button class="btn pri" type="submit">Buscar</button><button class="btn" type="button" id="meBtn" aria-label="Mi ubicación"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></form>
    <div class="results" id="results" hidden></div>
    <div class="layers"><button class="btn" type="button" id="layBtn" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Capas</button><div class="lpanel" id="lpanel" hidden></div></div>
  </div>
  <nav class="tabs gut" id="tabs" aria-label="Secciones"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
/* ---------- constantes ---------- */
const ESTADOS=[['sin_contactar','Sin contactar'],['no_contesta','No contesta'],['en_conversacion','En conversación'],['esperando_muestra','Esperando muestra'],['muestra_entregada','Muestra entregada'],['venta','Venta'],['no_interesado','No interesado']];
const EL=Object.fromEntries(ESTADOS);
const MIGR={enviado:'no_contesta',respondio:'en_conversacion',interesado:'en_conversacion',descartado:'no_interesado',nuevo:'sin_contactar',charla:'en_conversacion',espera_muestra:'esperando_muestra',con_muestra:'muestra_entregada',cliente:'venta'};
const SIT={
  primer:{n:'Primer contacto',est:['sin_contactar'],dias:0,base:'contacto',d:'Locales que todavía no contactaste.'},
  reintento:{n:'Reintento: no contestaron',est:['no_contesta'],dias:3,base:'envio',d:'Les escribiste y no respondieron. Conviene dejar al menos 3 días entre mensajes.'},
  charla:{n:'Ofrecer muestra',est:['en_conversacion'],dias:0,base:'contacto',d:'Ya respondieron: proponé llevarles una muestra.'},
  espera:{n:'Coordinar entrega de muestra',est:['esperando_muestra'],dias:0,base:'estado',d:'Pidieron muestra y todavía no se la llevaste.'},
  muestra:{n:'Seguimiento de muestra',est:['muestra_entregada'],dias:4,base:'estado',d:'Ya tienen la muestra: preguntá qué les pareció y pasá precio.'},
  reposicion:{n:'Reposición a clientes',est:['venta'],dias:30,base:'compra',d:'Clientes que compraron hace un tiempo: ofrecé reponer o un modelo nuevo.'},
  recontacto:{n:'Recontactar no interesados',est:['no_interesado'],dias:60,base:'contacto',d:'Pasó tiempo desde que dijeron que no: volvé con una novedad.'}
};
const EST_SIT={sin_contactar:'primer',no_contesta:'reintento',en_conversacion:'charla',esperando_muestra:'espera',muestra_entregada:'muestra',venta:'reposicion',no_interesado:'recontacto'};
const DEF_PL=[
 {id:'def_primer1',sit:'primer',nombre:'Primer contacto — llaveros con logo',texto:'{saludo}, ¿cómo están en {nombre}? Soy {firma}. Hacemos llaveros personalizados en 3D con el logo de tu negocio, ideales para regalar a clientes o vender en el mostrador. Trabajamos por mayor con precios para comercios. ¿Te paso fotos y precios sin compromiso?'},
 {id:'def_primer2',sit:'primer',nombre:'Primer contacto — corto',texto:'{saludo}! Soy {firma}, hacemos llaveros 3D con el logo de comercios de la zona. ¿Te puedo mandar algunas fotos para que veas cómo quedaría el de {nombre}?'},
 {id:'def_reintento',sit:'reintento',nombre:'Reintento con muestra gratis',texto:'{saludo}! Te había escrito por los llaveros con el logo de {nombre}. Si querés, esta semana paso por el local y te dejo una muestra sin cargo para que la veas en mano. ¿Te sirve?'},

const data={locales:{},plantillas:{},config:{}};
const H=l=>l.hist||[];
function lastEv(l,tipos){const h=H(l);for(let i=h.length-1;i>=0;i--)if(!tipos||tipos.includes(h[i].tipo))return h[i];return null}
function hasEv(l,tipo){return H(l).some(x=>x.tipo===tipo)}
const CONTACTO=['envio','visita','respuesta'];
const ultContacto=l=>lastEv(l,CONTACTO);
const ventasDe=l=>l.ventas||[];
const ultCompra=l=>{const v=ventasDe(l);return v.length?Math.max(...v.map(x=>x.t)):0};
function frecuencia(l){const v=ventasDe(l).map(x=>x.t).sort((a,b)=>a-b);return v.length<2?null:(v[v.length-1]-v[0])/DAY/(v.length-1)}
const dias=t=>t?Math.max(0,Math.floor((Date.now()-t)/DAY)):null;
const hace=t=>{if(!t)return '—';const d=dias(t);return d===0?'hoy':d===1?'ayer':'hace '+d+' d'};
const canalDe=x=>!x?'':x.tipo==='visita'||x.canal==='presencial'?'Presencial':'WhatsApp';
const est=l=>MIGR[l.estado]||l.estado||'sin_contactar';

function loadLocal(){
  try{const o=JSON.parse(localStorage.getItem(LS)||'{}');Object.assign(data,{locales:o.locales||{},plantillas:o.plantillas||{},config:o.config||{}})}catch(e){}
  let ch=false;
  Object.values(data.locales).forEach(l=>{
    if(MIGR[l.estado]){l.estado=MIGR[l.estado];ch=true}
    if(!EL[est(l)]){l.estado='sin_contactar';ch=true}
    if(!l.estadoT){const e=lastEv(l,['estado']);l.estadoT=e?e.t:(l.creado||Date.now());ch=true}
  });
  Object.values(data.plantillas).forEach(p=>{if(!SIT[p.sit]){p.sit='primer';ch=true}});
  if((data.config.seedV||0)<2){DEF_PL.forEach(p=>{if(!data.plantillas[p.id])data.plantillas[p.id]={nombre:p.nombre,sit:p.sit,texto:p.texto}});data.config.seedV=2;ch=true}
  if(ch)saveLocal();
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){toast('No se pudo guardar: el teléfono no tiene espacio libre para la app.')}}

/* ---------- dominio ---------- */
function normTel(t){
  let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  const orig=d;
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('54')){d=d.slice(2);if(d.startsWith('9'))d=d.slice(1)}
  if(d.startsWith('0'))d=d.slice(1);
  if(d.length===12){for(const L of [2,3,4]){if(d.substr(L,2)==='15'){d=d.slice(0,L)+d.slice(L+2);break}}}
  return d.length===10?'549'+d:orig;
}
function base(){const c=data.config;return (c.baseLat!=null&&c.baseLat!==''&&isFinite(c.baseLat)&&isFinite(c.baseLng))?{lat:+c.baseLat,lng:+c.baseLng,nombre:c.baseNombre||'Punto de partida'}:null}
function hasPos(l){return !!l&&l.lat!=null&&l.lat!==''&&isFinite(parseFloat(l.lat))&&isFinite(parseFloat(l.lng))}
function hav(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function distKm(l){const b=base();return b&&hasPos(l)?hav(b,{lat:+l.lat,lng:+l.lng}):null}
function fmtKm(d){if(d==null)return '—';if(d<1)return Math.round(d*100)*10+' m';return d.toLocaleString('es-AR',{maximumFractionDigits:d<10?1:0})+' km'}
function saludo(){const h=new Date().getHours();return h<13?'Buen día':h<20?'Buenas tardes':'Buenas noches'}
function fill(tpl,l){
  const d=distKm(l),uc=ultContacto(l),u=ultCompra(l);
  const v={saludo:saludo(),nombre:l.nombre||'',rubro:(l.rubro||'').toLowerCase(),direccion:l.direccion||'',zona:l.zona||'',distancia:d==null?'':fmtKm(d),
    dias:String(dias(l.estado==='muestra_entregada'?l.estadoT:(uc&&uc.t))??''),dias_compra:String(dias(u)??''),firma:data.config.firma||''};
  return String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
}
function waUrl(l,msg){const n=normTel(l.tel);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(msg||''):''}
function mapsUrl(l){return 'https://www.google.com/maps/search/?api=1&query='+(hasPos(l)?l.lat+','+l.lng:encodeURIComponent((l.nombre||'')+' '+(l.direccion||'')))}
function dirUrl(l){return 'https://www.google.com/maps/dir/?api=1&destination='+(hasPos(l)?l.lat+','+l.lng:encodeURIComponent((l.nombre||'')+' '+(l.direccion||'')))}
function addHist(l,tipo,txt,extra){l.hist=H(l).concat(Object.assign({t:Date.now(),tipo,txt:txt||''},extra||{})).slice(-150)}
function setEst(l,e){if(est(l)===e)return;addHist(l,'estado',EL[est(l)]+' → '+EL[e]);l.estado=e;l.estadoT=Date.now()}
function plantillas(){return Object.entries(data.plantillas).map(([id,p])=>({id,...p})).sort((a,b)=>Object.keys(SIT).indexOf(a.sit)-Object.keys(SIT).indexOf(b.sit)||(a.nombre||'').localeCompare(b.nombre||''))}
function locales(){return Object.entries(data.locales).map(([id,l])=>({id,...l}))}
function rubros(){return [...new Set(locales().map(l=>l.rubro).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function diasSit(l,b){const t=b==='envio'?(lastEv(l,['envio'])||{}).t:b==='estado'?l.estadoT:b==='compra'?ultCompra(l):(ultContacto(l)||{}).t;const d=dias(t);return d==null?Infinity:d}
function chip(e){return '<span class="chip"><span class="dot" style="--c:'+sc(e)+'"></span>'+EL[e]+'</span>'}
const contactado=l=>CONTACTO.some(t=>hasEv(l,t))||est(l)!=='sin_contactar';
const respondio=l=>hasEv(l,'respuesta')||['en_conversacion','esperando_muestra','muestra_entregada','venta'].includes(est(l));
const reponer=l=>{const u=ultCompra(l);if(!u)return false;return dias(u)>=(frecuencia(l)||30)};

function filtrados(){
  const q=S.q.trim().toLowerCase();
  let ls=locales().filter(l=>(!S.fRubro||l.rubro===S.fRubro)&&(!S.fEstado||est(l)===S.fEstado)&&(!q||[l.nombre,l.direccion,l.rubro,l.zona,l.tel].join(' ').toLowerCase().includes(q)));
  if(S.orden==='dist')ls.sort((a,b)=>(distKm(a)??1e9)-(distKm(b)??1e9));
  else if(S.orden==='nombre')ls.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  else ls.sort((a,b)=>((ultContacto(b)||{}).t||b.creado||0)-((ultContacto(a)||{}).t||a.creado||0));
  return ls;
}

/* ----- difusión ----- */
function candidatos(){
  const c=S.camp,s=SIT[c.sit],km=parseFloat(c.km),dm=c.dmin===''||c.dmin==null?s.dias:+c.dmin;
  const ls=locales().filter(l=>s.est.includes(est(l))&&(!c.rubro||l.rubro===c.rubro)&&(!(km>0)||(distKm(l)??1e9)<=km)&&diasSit(l,s.base)>=dm);
  const con=ls.filter(l=>normTel(l.tel)).sort((a,b)=>(distKm(a)??1e9)-(distKm(b)??1e9));
  return {con,sin:ls.filter(l=>!normTel(l.tel))};
}

function diasRespuesta(l){let out=null;for(const x of H(l)){if(x.tipo==='envio')out=x.t;else if(x.tipo==='respuesta'&&out)return (x.t-out)/DAY}return null}
function chartDias(ls){
  const t0=new Date();t0.setHours(0,0,0,0);const days=[];
  for(let i=13;i>=0;i--)days.push({d:new Date(t0.getTime()-i*DAY),w:0,p:0});
  ls.forEach(l=>H(l).forEach(x=>{if(x.tipo!=='envio'&&x.tipo!=='visita')return;const dd=new Date(x.t);dd.setHours(0,0,0,0);const f=days.find(o=>o.d.getTime()===dd.getTime());if(f)x.tipo==='envio'?f.w++:f.p++}));
  const max=Math.max(1,...days.map(o=>o.w+o.p)),nice=[1,2,5,10,20,25,50,100,200,500].find(v=>v>=max)||max;
  const W=340,Hh=150,pl=28,pb=22,pt=14,cw=(W-pl-6)/14,ch=Hh-pb-pt;
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ch-ch*f;g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-5)+'" y="'+(y+3.5).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+(Math.round(nice*f*10)/10)+'</text>'});
  days.forEach((o,i)=>{const x=pl+i*cw+cw*.18,w=cw*.64,hw=ch*o.w/nice,hp=ch*o.p/nice,yb=pt+ch;
    if(o.w)g+='<rect x="'+x.toFixed(1)+'" y="'+(yb-hw).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hw.toFixed(1)+'" fill="var(--wa)"/>';
    if(o.p)g+='<rect x="'+x.toFixed(1)+'" y="'+(yb-hw-hp).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hp.toFixed(1)+'" fill="var(--accent)"/>';
    if(o.w+o.p)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(yb-hw-hp-3).toFixed(1)+'" font-size="9" text-anchor="middle" fill="var(--muted)">'+(o.w+o.p)+'</text>';
    if(i%2===1||i===13)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(Hh-6)+'" font-size="9.5" text-anchor="middle" fill="var(--muted)">'+(i===13?'hoy':o.d.getDate())+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Contactos por día">'+g+'</svg>';
}
function chartMeses(vs){
  const now=new Date(),ms=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({d,n:0,m:0})}
  vs.forEach(v=>{const d=new Date(v.t);const f=ms.find(o=>o.d.getFullYear()===d.getFullYear()&&o.d.getMonth()===d.getMonth());if(f){f.n++;f.m+=(+v.monto||0)}});
  const max=Math.max(1,...ms.map(o=>o.n)),nice=[1,2,5,10,20,25,50,100,200,500].find(v=>v>=max)||max;
  const W=340,Hh=160,pl=28,pb=34,pt=16,cw=(W-pl-6)/6,ch=Hh-pb-pt;
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ch-ch*f;g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-5)+'" y="'+(y+3.5).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+(Math.round(nice*f*10)/10)+'</text>'});
  ms.forEach((o,i)=>{const x=pl+i*cw+cw*.22,w=cw*.56,h=ch*o.n/nice,y=pt+ch-h;
    if(o.n)g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="var(--s-venta)"/><text x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">'+o.n+'</text>';
    g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(Hh-18)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+o.d.toLocaleDateString('es-AR',{month:'short'}).replace('.','')+'</text>';
    if(o.m)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(Hh-5)+'" font-size="8.5" text-anchor="middle" fill="var(--muted)">'+(o.m>=1e6?(o.m/1e6).toFixed(1)+'M':o.m>=1e3?Math.round(o.m/1e3)+'k':o.m)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Ventas por mes">'+g+'</svg>';
}

/* ----- ruta de visitas ----- */
function ruta(){const r=data.config.ruta;return r&&Array.isArray(r.ids)?r:null}
function saveRuta(r){setCfg({ruta:r})}
function inicioRuta(r){return (r&&r.desde)||base()}
function ordenar(ids,start,end){
  let P=ids.map(id=>({id,lat:+data.locales[id].lat,lng:+data.locales[id].lng})).filter(p=>isFinite(p.lat)&&isFinite(p.lng));
  const sinPos=ids.filter(id=>!P.some(p=>p.id===id));
  if(!P.length)return ids;
  if(!start){start=P[0]}
  let rest=P.slice(),cur=start,ord=[];
  while(rest.length){let bi=0,bd=1e18;rest.forEach((p,i)=>{const d=hav(cur,p);if(d<bd){bd=d;bi=i}});cur=rest[bi];ord.push(cur);rest.splice(bi,1)}
  let mejora=true,vueltas=0;
  while(mejora&&vueltas++<60){mejora=false;
    for(let i=0;i<ord.length-1;i++)for(let k=i+1;k<ord.length;k++){
      const a=i===0?start:ord[i-1],b=ord[i],c=ord[k],d=k===ord.length-1?end:ord[k+1];
      const antes=hav(a,b)+(d?hav(c,d):0),despues=hav(a,c)+(d?hav(b,d):0);
      if(despues+1e-9<antes){ord=ord.slice(0,i).concat(ord.slice(i,k+1).reverse(),ord.slice(k+1));mejora=true}
    }}
  return ord.map(p=>p.id).concat(sinPos);
}
function secuencia(r){
  const st=inicioRuta(r),stops=r.ids.map(id=>data.locales[id]).filter(hasPos).map(l=>({lat:+l.lat,lng:+l.lng}));
  const fin=r.hasta||(r.volver&&st?st:null);
  return [st,...stops,fin].filter(Boolean);
}
function kmRuta(r){const s=secuencia(r);let t=0;for(let i=1;i<s.length;i++)t+=hav(s[i-1],s[i]);return t}
function filtroRuta(l){const f=S.rf;return (!f.est.length||f.est.includes(est(l)))&&(!f.rubro||l.rubro===f.rubro)&&(!f.sinWsp||!normTel(l.tel))}
function parseCoords(t){t=String(t||'');const m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/);return m?{lat:parseFloat(m[1]),lng:parseFloat(m[2])}:null}
async function geocodificar(t){
  const p=parseCoords(t);if(p)return {...p,nombre:t};
  const j=await nomi('search?q='+encodeURIComponent(t)+'&countrycodes=ar&limit=1');
  if(!j.length)throw new Error('sin resultados');
  return {lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6),nombre:t};
}
async function armarAuto(){
  const f=S.rf;
  let A,B=null;
  try{A=f.desde.trim()?await geocodificar(f.desde.trim()):base();if(f.hasta.trim())B=await geocodificar(f.hasta.trim())}
  catch(e){toast('No encontré esa dirección. Probá con calle, altura y localidad.');return}
  if(!A){toast('Escribí desde dónde salís o configurá tu punto de partida');return}
  const w=parseFloat(f.ancho)||1,max=Math.max(1,parseInt(f.max)||15);
  const k=Math.cos(A.lat*Math.PI/180),xy=p=>({x:(p.lng-A.lng)*111.32*k,y:(p.lat-A.lat)*110.57});
  let cands=locales().filter(l=>hasPos(l)&&filtroRuta(l)).map(l=>{const p=xy({lat:+l.lat,lng:+l.lng});
    if(!B)return {l,t:Math.hypot(p.x,p.y),d:Math.hypot(p.x,p.y)};
    const b=xy(B),L2=b.x*b.x+b.y*b.y,t=L2?(p.x*b.x+p.y*b.y)/L2:0,tc=Math.max(0,Math.min(1,t));
    return {l,t,d:Math.hypot(p.x-b.x*tc,p.y-b.y*tc)}}).filter(o=>o.d<=w&&(!B||(o.t>=-0.03&&o.t<=1.03)));
  if(!cands.length){toast('No hay locales con esos filtros '+(B?'en ese recorrido':'en ese radio')+'. Probá ampliar el ancho.');return}
  cands.sort((a,b)=>B?a.t-b.t:a.d-b.d);
  if(cands.length>max)cands=B?cands.sort((a,b)=>a.d-b.d).slice(0,max):cands.slice(0,max);
  const ids=ordenar(cands.map(o=>o.l.id),A,B||(f.volver?A:null));
  saveRuta({ids,desde:f.desde.trim()?A:null,hasta:B,volver:!B&&f.volver,visit:{},t:Date.now()});
  toast('Ruta armada con '+ids.length+' paradas');
}
function armarManual(ids){
  if(!ids.length){toast('Elegí al menos un local');return}
  const A=base(),f=S.rf;
  saveRuta({ids:ordenar(ids,A,f.volver?A:null),desde:null,hasta:null,volver:f.volver,visit:{},t:Date.now()});
  S.rf.sel=[];toast('Ruta armada con '+ids.length+' paradas');
}
function rutaCon(ids,msg){
  const A=base();
  saveRuta({ids:ordenar(ids,A,A),desde:null,hasta:null,volver:true,visit:{},t:Date.now()});
  S.tab='ajustes';S.sheet=null;render();$('#view').scrollTop=0;toast(msg||('Ruta armada con '+ids.length+' paradas'));
}

function parseImport(txt){
  txt=txt.trim();if(!txt)return [];
  if(/^[\[{]/.test(txt)){let j=JSON.parse(txt);if(!Array.isArray(j))j=Array.isArray(j.locales)?j.locales:[j];return j}
  const l0=txt.split('\n')[0],sep=(l0.match(/;/g)||[]).length>(l0.match(/,/g)||[]).length?';':(l0.includes('\t')?'\t':',');
  const rows=[];let cur=[''],q=false;

  rows.push(cur);
  const hd=rows.shift().map(h=>h.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hd.map((h,i)=>[h,(r[i]||'').trim()])));
}
function normRow(o){
  const g=(...ks)=>{for(const k of ks){if(o[k]!=null&&o[k]!=='')return o[k]}return ''};
  const lat=parseFloat(g('lat','latitud','latitude')),lng=parseFloat(g('lng','lon','long','longitud','longitude'));
  return {nombre:String(g('nombre','name','local','negocio')),rubro:String(g('rubro','categoria','category','tipo')),direccion:String(g('direccion','address','domicilio')),
    tel:String(g('tel','telefono','phone','whatsapp','celular')),lat:isFinite(lat)?lat:null,lng:isFinite(lng)?lng:null,zona:String(g('zona','barrio','localidad','ciudad')),web:String(g('web','sitio','website'))};
}
function doImport(){
  let arr;try{arr=parseImport(S.importTxt)}catch(e){toast('No pude leer el texto: revisá que sea CSV o JSON válido.');return}
  const keyOf=l=>normTel(l.tel)||((l.nombre||'')+'|'+(l.direccion||'')).toLowerCase();
  const seen=new Set(locales().map(keyOf));let n=0,rep=0;
  for(const o of arr){const l=normRow(o);if(!l.nombre)continue;const k=keyOf(l);if(seen.has(k)){rep++;continue}seen.add(k);
    l.estado='sin_contactar';l.creado=Date.now();l.estadoT=Date.now();l.hist=[];data.locales[uid('l')]=l;n++}
  saveLocal();S.importTxt='';fitted=false;toast(n+' locales importados'+(rep?' · '+rep+' repetidos salteados':''));S.tab='locales';render();
}
async function copyFrom(text,srcId){
  try{await navigator.clipboard.writeText(text);toast('Copiado')}catch(e){const el=srcId&&document.getElementById(srcId);if(el&&el.select){el.focus();el.select()}toast('Seleccioné el texto: copialo con el menú del teléfono')}
}
function irCampana(sit){S.camp=Object.assign(S.camp,{sit,pl:'',dmin:'',cola:null});S.tab='difusion';S.sheet=null;render();$('#view').scrollTop=0}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.id==='sheet'){S.sheet=null;render()}return}
  const a=el.dataset.act,id=el.dataset.id;
  if(!['delLocal','delPl','wipe','delVenta','rutaBorrar'].includes(a))S.confirm=null;
  switch(a){
   case 'tab':S.tab=el.dataset.t;S.sheet=null;if(S.tab!=='locales')S.verRuta=false;render();$('#view').scrollTop=0;break;
   case 'vista':S.vista=el.dataset.v;render();break;
   case 'verF':S.verFiltros=!S.verFiltros;render();break;
   case 'fEst':S.fEstado=el.dataset.e;render();break;
   case 'open':openSheet(id);break;
   case 'close':S.sheet=null;render();break;
   case 'goFiltro':S.tab='locales';S.fEstado=el.dataset.e;render();break;
   case 'segV':S.segVista=el.dataset.v;render();break;
   case 'expand':S.expand[el.dataset.k]=!S.expand[el.dataset.k];render();break;
   case 'campSit':irCampana(el.dataset.s);break;
   case 'setEst':mod(S.sheet,l=>setEst(l,el.dataset.e));break;
   case 'pidioMuestra':mod(S.sheet,l=>{addHist(l,'muestra_pedida',S.nota.trim());setEst(l,'esperando_muestra')});S.nota='';toast('Marcado: espera muestra');break;
   case 'muestraOk':mod(S.sheet,l=>{addHist(l,'muestra_entregada',S.nota.trim());setEst(l,'muestra_entregada')});S.nota='';toast('Muestra entregada');break;
   case 'ventaForm':S.vForm={fecha:hoy(),monto:'',detalle:''};render();break;
   case 'ventaCancel':S.vForm=null;render();break;
   case 'saveVenta':{const f=S.vForm,t=new Date((f.fecha||hoy())+'T12:00').getTime(),m=parseFloat(String(f.monto).replace(',','.'));
     mod(S.sheet,l=>{l.ventas=ventasDe(l).concat({t,detalle:f.detalle.trim(),monto:isFinite(m)?m:null});addHist(l,'venta',[f.fecha!==hoy()?fecha(t):'',f.detalle.trim(),isFinite(m)?plata(m):''].filter(Boolean).join(' · '));setEst(l,'venta')});
     S.vForm=null;toast('Venta registrada');break}
   case 'delVenta':{const i=+el.dataset.i;if(S.confirm!=='delVenta'+i){S.confirm='delVenta'+i;render();break}mod(S.sheet,l=>{l.ventas=ventasDe(l).filter((_,j)=>j!==i)});S.confirm=null;toast('Venta quitada');break}
   case 'shSent':if(!S.sheetMsg.trim()){toast('Escribí el mensaje primero');break}registrarEnvio(S.sheet,S.sheetMsg);toast('Registrado como enviado');break;
   case 'addResp':case 'addVisita':case 'addNota':{const t=S.nota.trim();if(!t&&a==='addNota'){toast('Escribí la nota primero');break}
     mod(S.sheet,l=>{if(a==='addResp'){addHist(l,'respuesta',t,{canal:'wsp'});if(['sin_contactar','no_contesta'].includes(est(l)))setEst(l,'en_conversacion')}
       else if(a==='addVisita'){addHist(l,'visita',t,{canal:'presencial'});if(est(l)==='sin_contactar')setEst(l,'en_conversacion');const r=ruta();if(r&&r.ids.includes(S.sheet)&&!(r.visit||{})[S.sheet]){const r2=clone(r);r2.visit=r2.visit||{};r2.visit[S.sheet]=Date.now();data.config.ruta=r2}}
       else addHist(l,'nota',t);if(t)l.notaUlt=t.slice(0,80)});
     S.nota='';toast(a==='addResp'?'Respuesta registrada':a==='addVisita'?'Visita registrada':'Nota guardada');break}
   case 'saveEdit':{const E=S.edit;mod(S.sheet,l=>{['nombre','rubro','zona','direccion','tel','web'].forEach(k=>l[k]=String(E[k]||'').trim());
     const la=parseFloat(String(E.lat).replace(',','.')),ln=parseFloat(String(E.lng).replace(',','.'));l.lat=isFinite(la)?la:null;l.lng=isFinite(ln)?ln:null});S.edit=null;toast('Datos guardados');break}
   case 'delLocal':if(S.confirm!=='delLocal'){S.confirm='delLocal';render();break}{const r=ruta();if(r&&r.ids.includes(S.sheet))data.config.ruta=Object.assign(clone(r),{ids:r.ids.filter(x=>x!==S.sheet)})}del('locales',S.sheet);S.sheet=null;S.confirm=null;toast('Local eliminado');render();break;
   case 'toMap':S.sheet=null;S.tab='locales';S.vista='mapa';S.verRuta=false;S.focus=id;render();break;
   case 'rutaToggle':{const r=ruta()?clone(ruta()):{ids:[],desde:null,hasta:null,volver:true,visit:{},t:Date.now()};
     if(r.ids.includes(id)){r.ids=r.ids.filter(x=>x!==id);toast('Quitado de la ruta')}else{r.ids.push(id);toast('Agregado a la ruta: '+r.ids.length+(r.ids.length===1?' parada':' paradas'))}saveRuta(r);break}
   case 'newPl':S.editPl='new';S.plNombre='';S.plSit=S.camp.sit;S.plTexto='{saludo}, ¿cómo están en {nombre}? ';render();break;
   case 'editPl':{const p=data.plantillas[id];S.editPl=id;S.plNombre=p.nombre||'';S.plTexto=p.texto||'';S.plSit=p.sit||'primer';render();break}
   case 'cancelPl':S.editPl=null;render();break;
   case 'savePl':{if(!S.plTexto.trim()){toast('El mensaje está vacío');break}const pid=S.editPl==='new'?uid('p'):S.editPl;S.editPl=null;write('plantillas',pid,{nombre:S.plNombre.trim()||'Plantilla',sit:S.plSit,texto:S.plTexto});toast('Plantilla guardada');break}
   case 'delPl':if(S.confirm!=='delPl'){S.confirm='delPl';render();break}{const pid=S.editPl;S.editPl=null;S.confirm=null;del('plantillas',pid);toast('Plantilla eliminada')}break;
   case 'insVar':{const ta=$('#plTexto'),v='{'+el.dataset.v+'}',s=ta.selectionStart??ta.value.length,e2=ta.selectionEnd??s;S.plTexto=ta.value.slice(0,s)+v+ta.value.slice(e2);render();const t2=$('#plTexto');t2.focus();t2.setSelectionRange(s+v.length,s+v.length);break}
   case 'startCamp':{const c=S.camp,cand=candidatos().con;if(!cand.length||!c.pl)break;c.cola=cand.map(l=>l.id);c.i=0;c.enviados=0;c.plUse=data.plantillas[c.pl].texto;c.msg=fill(c.plUse,cand[0]);render();$('#view').scrollTop=0;break}
   case 'campSent':case 'campSkip':{const c=S.camp,cid=c.cola[c.i];if(a==='campSent'){registrarEnvio(cid,c.msg);c.enviados++}
     c.i++;const nx=data.locales[c.cola[c.i]];c.msg=nx?fill(c.plUse,{id:c.cola[c.i],...nx}):'';render();$('#view').scrollTop=0;break}
   case 'endCamp':S.camp.cola=null;render();break;
   case 'rutaSin':rutaCon(candidatos().sin.map(l=>l.id),'Ruta armada con los que no tienen WhatsApp');break;
   case 'rutaEst':rutaCon(locales().filter(l=>est(l)===el.dataset.e).map(l=>l.id));break;
   case 'copy':{const s=document.getElementById(el.dataset.src);copyFrom(s?s.value:'',el.dataset.src);break}
   case 'saveBase':{const nom=S.baseNombre??data.config.baseNombre??'',t=S.baseTxt.trim(),p=parseCoords(t),b=base();
     if(p){setBase(p.lat,p.lng,nom);break}
     if(!t){if(b)setBase(b.lat,b.lng,nom);else toast('Escribí una dirección o pegá coordenadas');break}
     toast('Buscando la dirección…');
     geocodificar(t).then(g=>setBase(g.lat,g.lng,nom||t)).catch(()=>toast('No encontré esa dirección. Probá con calle, altura y localidad.'));break}
   case 'baseGps':gps((la,ln)=>setBase(+la.toFixed(6),+ln.toFixed(6),S.baseNombre??data.config.baseNombre??'Mi ubicación'));break;
   case 'saveFirma':setCfg({firma:(S.firma??'').trim()});S.firma=null;toast('Firma guardada');break;
   case 'import':doImport();break;
   case 'export':{const blob=new Blob([JSON.stringify({app:'radar-locales',v:2,exportado:new Date().toISOString(),...data},null,1)],{type:'application/json'});
     const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='radar-locales-'+hoy()+'.json';document.body.appendChild(a2);a2.click();setTimeout(()=>{URL.revokeObjectURL(a2.href);a2.remove()},1000);break}
   case 'wipe':if(S.confirm!=='wipe'){S.confirm='wipe';render();break}data.locales={};if(data.config.ruta)data.config.ruta=null;S.confirm=null;saveLocal();render();toast('Locales borrados');break;
   case 'rfModo':S.rf.modo=el.dataset.v;render();break;
   case 'rfEst':{const e=el.dataset.e,f=S.rf;f.est=f.est.includes(e)?f.est.filter(x=>x!==e):f.est.concat(e);render();break}
   case 'rfSel':{const f=S.rf;f.sel=f.sel.includes(id)?f.sel.filter(x=>x!==id):f.sel.concat(id);render();break}
   case 'rfTodos':{const f=S.rf,q=f.q.trim().toLowerCase(),xs=locales().filter(l=>filtroRuta(l)&&(!q||[l.nombre,l.direccion,l.rubro].join(' ').toLowerCase().includes(q))).sort((a,b)=>(distKm(a)??1e9)-(distKm(b)??1e9)).slice(0,60).map(l=>l.id);
     f.sel=xs.every(x=>f.sel.includes(x))?f.sel.filter(x=>!xs.includes(x)):[...new Set(f.sel.concat(xs))];render();break}
   case 'rutaAuto':toast('Buscando locales…');armarAuto();break;
   case 'rutaManual':armarManual(S.rf.sel);break;
   case 'rutaVisit':{const r=clone(ruta());r.visit=r.visit||{};r.visit[id]=Date.now();data.config.ruta=r;mod(id,l=>{addHist(l,'visita','Visita de la ruta',{canal:'presencial'});if(est(l)==='sin_contactar')setEst(l,'en_conversacion')});openSheet(id);toast('Visita registrada: actualizá cómo te fue');break}
   case 'rutaQuitar':{const r=clone(ruta());r.ids=r.ids.filter(x=>x!==id);saveRuta(r);break}
   case 'rutaReordenar':{const r=clone(ruta()),st=inicioRuta(r);r.ids=ordenar(r.ids,st,r.hasta||(r.volver?st:null));saveRuta(r);toast('Ruta reordenada');break}
   case 'rutaBorrar':if(S.confirm!=='rutaBorrar'){S.confirm='rutaBorrar';render();break}S.confirm=null;setCfg({ruta:null});toast('Ruta borrada');break;
   case 'verRutaMapa':S.tab='locales';S.vista='mapa';S.verRuta=true;fitted=false;render();break;
   case 'salirRuta':S.verRuta=false;fitted=false;render();break;
   case 'ui':{const u=ui();u[el.dataset.k]=el.dataset.v;applyUI(u);setCfg({ui:u});break}
   case 'uiReset':applyUI(UI_DEF);setCfg({ui:Object.assign({},UI_DEF)});toast('Diseño restablecido');break;
  }
});
document.addEventListener('toggle',ev=>{if(ev.target.tagName!=='DETAILS')return;if(ev.target.open&&!S.edit&&S.sheet){const l=data.locales[S.sheet];S.edit={nombre:l.nombre,rubro:l.rubro,zona:l.zona,direccion:l.direccion,tel:l.tel,lat:l.lat??'',lng:l.lng??'',web:l.web};render()}else if(!ev.target.open&&S.edit)S.edit=null},true);
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='fsRange'){const u=ui();u.fs=+el.value;applyUI(u);const v=$('#fsVal');if(v)v.textContent=el.value;return}
  const m=el.dataset&&el.dataset.model;if(!m)return;
  setPath(m,el.value);
  if(el.dataset.live!==undefined)render();
  if(el.dataset.prev){const pv=document.getElementById(el.dataset.prev);if(pv)pv.textContent=fill(el.value,locales()[0]||{nombre:'Kiosco Don Pepe',rubro:'Kiosco',direccion:'Av. Rivadavia 1234',zona:'Centro'})}
  if(el.dataset.wa){const w=document.getElementById(el.dataset.wa);const lid=el.dataset.wa==='shWa'?S.sheet:S.camp.cola&&S.camp.cola[S.camp.i];const l=data.locales[lid];if(w&&l)w.href=waUrl(l,el.value)}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='fsRange'){const u=ui();u.fs=+el.value;setCfg({ui:u});return}
  if(el.id==='bk'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o.locales!=='object'||Array.isArray(o.locales))throw 0;
      Object.assign(data.locales,o.locales);Object.assign(data.plantillas,o.plantillas||{});if(o.config&&!base())data.config=Object.assign(clone(data.config),o.config);saveLocal();loadLocal();applyUI();fitted=false;render();toast('Copia restaurada: '+Object.keys(o.locales).length+' locales')}
    catch(e){toast('Ese archivo no es una copia de Radar de Locales')}el.value=''};fr.readAsText(el.files[0]);return}
  if(el.dataset.check){setPath(el.dataset.check,el.checked);render();return}
  if(el.dataset.render!==undefined){setPath(el.dataset.model,el.value);render();return}
  if(el.dataset.model==='rf.hasta'){render();return}
  const a=el.dataset.actChange;
  if(a==='setProx'){mod(S.sheet,l=>{l.proximo=el.value});toast(el.value?'Seguimiento agendado':'Seguimiento quitado')}
  if(a==='shPl'){S.sheetPl=el.value;S.sheetMsg=fill(data.plantillas[el.value].texto,{id:S.sheet,...data.locales[S.sheet]});render()}
  if(a==='cSit'){S.camp.sit=el.value;S.camp.pl='';S.camp.dmin='';render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render()}});

loadLocal();applyUI();S.vista=ui().vista;render();
$('#mapSearch').addEventListener('submit',ev=>{ev.preventDefault();$('#mq').blur();buscar($('#mq').value)});
$('#mq').addEventListener('input',ev=>{const q=ev.target.value.trim();clearTimeout(acT);if(acCtl)acCtl.abort();if(q.length<3){$('#results').hidden=true;return}acT=setTimeout(()=>sugerir(q),300)});
$('#meBtn').addEventListener('click',()=>gps((la,ln)=>{meLL=[la,ln];syncMap(filtrados());map.setView(meLL,17)}));
$('#layBtn').addEventListener('click',()=>{const p=$('#lpanel'),open=p.hidden;if(open)panelCapas();p.hidden=!open;$('#layBtn').setAttribute('aria-expanded',open)});
$('#lpanel').addEventListener('click',ev=>{const b=ev.target.closest('[data-capa]');if(b){setCapa(b.dataset.capa);$('#lpanel').hidden=true;$('#layBtn').setAttribute('aria-expanded','false')}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
