<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar de Locales</title>
<meta name="theme-color" content="#142036">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de una pantalla — barra superior, vista con scroll propio, barra de pestañas inferior; detalle en hoja deslizable */
:root{
  --bg:#EAEEF4; --surface:#FFFFFF; --sunk:#F3F5F9; --ink:#142036; --muted:#5A6478; --line:#D3DAE5;
  --accent:#F2A516; --accent-ink:#7A4E00; --on-accent:#1B1300; --wa:#12844A; --on-wa:#FFFFFF;
  --s-nuevo:#7A8699; --s-enviado:#2F6FDB; --s-respondio:#7B4FD6; --s-interesado:#C07F00; --s-cliente:#12844A; --s-descartado:#BF3A2F;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --tile-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#161F31; --sunk:#111928; --ink:#E6EBF4; --muted:#97A2B7; --line:#263149;
  --accent:#F5B335; --accent-ink:#F5B335; --on-accent:#1B1300; --wa:#2BB86C; --on-wa:#06210F;
  --s-nuevo:#8E99AD; --s-enviado:#6A9BF0; --s-respondio:#A585EE; --s-interesado:#E3A62A; --s-cliente:#2BB86C; --s-descartado:#E46A5E; --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#161F31; --sunk:#111928; --ink:#E6EBF4; --muted:#97A2B7; --line:#263149;
  --accent:#F5B335; --accent-ink:#F5B335; --on-accent:#1B1300; --wa:#2BB86C; --on-wa:#06210F;
  --s-nuevo:#8E99AD; --s-enviado:#6A9BF0; --s-respondio:#A585EE; --s-interesado:#E3A62A; --s-cliente:#2BB86C; --s-descartado:#E46A5E; --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7);
  color-scheme:dark}
*,::before,::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#view.compact{flex:none;overflow:visible;padding-block:4px 10px}
#mapPane{flex:1;position:relative;min-height:0;border-top:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--sunk)}
#map .tl-invert{filter:var(--tile-filter)}
.layers{position:absolute;z-index:500;left:max(10px,env(safe-area-inset-left,0px));bottom:26px;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px}
.layers>.btn{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.lpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.lpanel button{border:2px solid transparent;border-radius:10px;background:var(--sunk);padding:5px;font-weight:600;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:104px;color:var(--ink)}
.lpanel button[aria-pressed="true"]{border-color:var(--accent)}
.lpanel .sw{width:100%;height:46px;border-radius:6px;background:var(--line) center/cover no-repeat}
.results b{font-weight:600}
.leaflet-container{font-family:var(--f-body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-size:.88rem}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.pop{display:flex;flex-direction:column;gap:8px;min-width:210px}
.mapbar{position:absolute;z-index:500;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.mapbar input,.mapbar .btn{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.results{position:absolute;z-index:501;top:58px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.results button,.results div{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;font-size:.88rem}
.results button{cursor:pointer}
.results>:first-child{border-top:0}
.top{padding-block:12px 10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.base{font-size:.78rem;color:var(--muted);text-align:right;min-width:0}
.base b{color:var(--ink);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px 24px;display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent-ink)}
.tabs svg{width:22px;height:22px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:110px;line-height:1.45}
select{appearance:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.wa{background:var(--wa);color:var(--on-wa);border-color:transparent}
.btn.danger{color:var(--s-descartado)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:first-child{border-top:0}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;font-size:.8rem;color:var(--muted)}
.item>div{min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--s-nuevo))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.chip .dot{width:8px;height:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.chip{cursor:pointer}
.chips button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pipe button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pipe .n{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.pipe .l{font-size:.75rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty p{margin:0;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.radar-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.radar-wrap svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);padding:4px 6px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars button{font-family:var(--f-mono);font-size:.75rem;border:1px dashed var(--line);background:var(--sunk);border-radius:6px;padding:3px 7px;cursor:pointer}
.preview{background:var(--sunk);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:.9rem;border-left:3px solid var(--wa)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:4px}
.tl div{padding:4px 0 10px 14px;position:relative;font-size:.85rem}
.tl div::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));border:2px solid var(--surface)}
.tl .t{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.tl .x{white-space:pre-wrap;overflow-wrap:anywhere}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.85rem}
.funnel .bar{height:22px;border-radius:6px;background:var(--sunk);overflow:hidden}
.funnel .bar i{display:block;height:100%;border-radius:6px;background:var(--c)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums} td:first-child{font-family:var(--f-body)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .n{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.1}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.note{font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}
.warn{color:var(--s-interesado);font-weight:700}
/* hoja de detalle */
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:color-mix(in srgb,var(--ink) 38%,transparent)}
#sheet .panel{background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sh-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x-btn{border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none;font-size:1.2rem;line-height:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.edit-grid .wide{grid-column:1/-1}
@media (max-width:420px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.pipe{grid-template-columns:repeat(3,1fr)}.funnel .fr{grid-template-columns:90px 1fr 60px}}
@media (prefers-reduced-motion:no-preference){.item,.btn,.pipe button{transition:background-color .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div id="app">
  <header class="top gut">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/><circle cx="13" cy="13" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/><path d="M13 13 L22 6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><circle cx="13" cy="13" r="2" fill="currentColor"/><circle cx="18" cy="17" r="2" fill="var(--accent)"/></svg>Radar de Locales</div>
    <div class="base" id="baseInfo"></div>
  </header>
  <main id="view" class="gut"></main>
  <div id="mapPane" hidden>
    <div id="map"></div>
    <form class="mapbar" id="mapSearch"><input type="search" id="mq" placeholder="Calle y altura, localidad" autocomplete="off" enterkeyhint="search"><button class="btn pri" type="submit">Buscar</button><button class="btn" type="button" id="meBtn" aria-label="Mi ubicación"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></form>
    <div class="results" id="results" hidden></div>
    <div class="layers"><button class="btn" type="button" id="layBtn" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Capas</button><div class="lpanel" id="lpanel" hidden></div></div>
  </div>
  <nav class="tabs gut" id="tabs" aria-label="Secciones"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
const ESTADOS=[
 ['nuevo','Nuevo'],['enviado','Enviado'],['respondio','Respondió'],['interesado','Interesado'],['cliente','Cliente'],['descartado','Descartado']];
const EL=Object.fromEntries(ESTADOS);
const VARS=['saludo','nombre','rubro','direccion','zona','distancia','firma'];
const LS='radar-locales-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DAY=864e5;

/* ---------- datos ---------- */
const data={locales:{},plantillas:{},config:{}};
let mode='local', netNote='';
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||'{}');Object.assign(data,{locales:o.locales||{},plantillas:o.plantillas||{},config:o.config||{}})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){toast('No se pudo guardar: el teléfono no tiene espacio libre para la app.')}}
function write(col,id,body){if(col==='config')data.config=body;else data[col][id]=body;saveLocal();render()}
function patch(col,id,p){write(col,id,Object.assign(clone(data[col][id]),p))}
function del(col,id){delete data[col][id];saveLocal();render()}

/* ---------- utilidades de dominio ---------- */
function normTel(t){
  let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  const orig=d;
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('54')){d=d.slice(2);if(d.startsWith('9'))d=d.slice(1)}
  if(d.startsWith('0'))d=d.slice(1);
  if(d.length===12){for(const L of [2,3,4]){if(d.substr(L,2)==='15'){d=d.slice(0,L)+d.slice(L+2);break}}}
  return d.length===10?'549'+d:orig;
}
function base(){const c=data.config;return (isFinite(c.baseLat)&&isFinite(c.baseLng)&&c.baseLat!==''&&c.baseLat!=null)?{lat:+c.baseLat,lng:+c.baseLng,nombre:c.baseNombre||'Punto de partida'}:null}
function hasPos(l){return l&&isFinite(parseFloat(l.lat))&&isFinite(parseFloat(l.lng))}
function distKm(l){
  const b=base();if(!b||!hasPos(l))return null;
  const R=6371,toR=Math.PI/180,dLat=(l.lat-b.lat)*toR,dLng=(l.lng-b.lng)*toR;
  const a=Math.sin(dLat/2)**2+Math.cos(b.lat*toR)*Math.cos(l.lat*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtKm(d){if(d==null)return '—';if(d<1)return Math.round(d*1000/10)*10+' m';return d.toLocaleString('es-AR',{maximumFractionDigits:d<10?1:0})+' km'}
function saludo(){const h=new Date().getHours();return h<13?'Buen día':h<20?'Buenas tardes':'Buenas noches'}
function fill(tpl,l){
  const d=distKm(l);
  const v={saludo:saludo(),nombre:l.nombre||'',rubro:(l.rubro||'').toLowerCase(),direccion:l.direccion||'',zona:l.zona||'',distancia:d==null?'':fmtKm(d),firma:data.config.firma||''};
  return String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
}
function waUrl(l,msg){const n=normTel(l.tel);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(msg||''):''}
function mapsUrl(l){return hasPos(l)?'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((l.nombre||'')+' '+(l.direccion||''))}
function dirUrl(l){return 'https://www.google.com/maps/dir/?api=1&destination='+(hasPos(l)?l.lat+','+l.lng:encodeURIComponent((l.nombre||'')+' '+(l.direccion||'')))}
const est=l=>l.estado||'nuevo';
const lastT=(l,tipo)=>{const h=(l.hist||[]).filter(x=>!tipo||x.tipo===tipo);return h.length?h[h.length-1].t:0};
const hace=t=>{if(!t)return '—';const d=Math.floor((Date.now()-t)/DAY);return d<=0?'hoy':d===1?'ayer':'hace '+d+' d'};
function plantillas(){return Object.entries(data.plantillas).map(([id,p])=>({id,...p})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''))}
function locales(){return Object.entries(data.locales).map(([id,l])=>({id,...l}))}
function rubros(){return [...new Set(locales().map(l=>l.rubro).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function addHist(l,tipo,txt){l.hist=(l.hist||[]).concat({t:Date.now(),tipo,txt:txt||''}).slice(-120)}

function filtrados(){
  const q=S.q.trim().toLowerCase();
  let ls=locales().filter(l=>(!S.fRubro||l.rubro===S.fRubro)&&(!S.fEstado||est(l)===S.fEstado)&&(!q||[l.nombre,l.direccion,l.rubro,l.zona,l.tel].join(' ').toLowerCase().includes(q)));
  if(S.orden==='dist')ls.sort((a,b)=>(distKm(a)??1e9)-(distKm(b)??1e9));
  else if(S.orden==='nombre')ls.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  else ls.sort((a,b)=>Math.max(lastT(b),b.creado||0)-Math.max(lastT(a),a.creado||0));
  return ls;
}

function colaCandidatos(){

  const con=ls.filter(l=>normTel(l.tel)).sort((a,b)=>(distKm(a)??1e9)-(distKm(b)??1e9));
  return {con,sin:ls.length-con.length};
}

function vSeguimiento(){

  const charla=ls.filter(l=>['respondio','interesado'].includes(est(l))).sort((a,b)=>lastT(b)-lastT(a));

  const row=(l,extra)=>'<button class="item" data-act="open" data-id="'+l.id+'"><span class="dot" style="--c:'+sc(est(l))+'"></span><div><div class="nm">'+esc(l.nombre)+'</div><div class="sub">'+esc(l.rubro||'')+(l.notaUlt?' · '+esc(l.notaUlt):'')+'</div></div><div class="end">'+extra+'</div></button>';
  h+='<div class="sec"><h3>Para hoy · '+paraHoy.length+'</h3>'+(paraHoy.length?'<div class="list">'+paraHoy.map(l=>row(l,'<span class="'+(l.proximo<t?'warn':'')+'">'+(l.proximo<t?'Atrasado':'Hoy')+'</span>')).join('')+'</div>':'<p class="small muted" style="margin:0">Sin seguimientos agendados para hoy.</p>')+'</div>';
  h+='<div class="sec"><h3>Conversaciones activas · '+charla.length+'</h3>'+(charla.length?'<div class="list">'+charla.map(l=>row(l,EL[est(l)]+'<br>'+hace(lastT(l)))).join('')+'</div>':'<p class="small muted" style="margin:0">Cuando un local responda, abrilo y tocá "Registrar respuesta".</p>')+'</div>';
  h+='<div class="sec"><h3>Esperando respuesta · '+espera.length+'</h3>'+(espera.length?'<div class="list">'+espera.map(l=>{const d=Math.floor((Date.now()-lastT(l,'envio'))/DAY);return row(l,'<span class="'+(d>=3?'warn':'')+'">'+hace(lastT(l,'envio'))+'</span>')}).join('')+'</div>':'<p class="small muted" style="margin:0">Nadie pendiente.</p>')+
   (espera.some(l=>Date.now()-lastT(l,'envio')>=3*DAY)?'<p class="small muted" style="margin:0"><span class="warn">En naranja:</span> 3 días o más sin respuesta, buen momento para un segundo mensaje.</p>':'')+'</div>';
  return h;

function vMetricas(){
  const ls=locales();
  if(!ls.length)return emptyLocales();
  const envio=l=>(l.hist||[]).some(x=>x.tipo==='envio')||['enviado','respondio','interesado','cliente'].includes(est(l));
  const resp=l=>['respondio','interesado','cliente'].includes(est(l))||(l.hist||[]).some(x=>x.tipo==='respuesta');
  const contact=ls.filter(envio),res=contact.filter(resp),int=contact.filter(l=>['interesado','cliente'].includes(est(l))),cli=contact.filter(l=>est(l)==='cliente');
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const totalEnv=ls.reduce((s,l)=>s+(l.hist||[]).filter(x=>x.tipo==='envio').length,0);
  let h='<div class="kpis"><div class="kpi"><div class="n mono">'+contact.length+'</div><div class="l">Locales contactados de '+ls.length+'</div></div>'+
   '<div class="kpi"><div class="n mono">'+pct(res.length,contact.length)+'</div><div class="l">Tasa de respuesta</div></div>'+
   '<div class="kpi"><div class="n mono">'+pct(cli.length,contact.length)+'</div><div class="l">Conversión a cliente</div></div>'+
   '<div class="kpi"><div class="n mono">'+totalEnv+'</div><div class="l">Mensajes enviados</div></div></div>';
  const fr=[['Contactados',contact.length,'enviado'],['Respondieron',res.length,'respondio'],['Interesados',int.length,'interesado'],['Clientes',cli.length,'cliente']];
  h+='<div class="sec"><h3>Embudo</h3><div class="card funnel">'+fr.map(([n,v,e])=>'<div class="fr"><span>'+n+'</span><div class="bar"><i style="--c:'+sc(e)+';width:'+(contact.length?(v/contact.length*100):0).toFixed(1)+'%"></i></div><span class="mono" style="text-align:right">'+v+' <span class="muted">'+pct(v,contact.length)+'</span></span></div>').join('')+'</div></div>';
  h+='<div class="sec"><h3>Envíos de los últimos 14 días</h3><div class="card chart">'+chartDias(ls)+'</div></div>';
  const by={};ls.forEach(l=>{const r=l.rubro||'Sin rubro';by[r]=by[r]||{t:0,c:0,r:0,k:0};by[r].t++;if(envio(l))by[r].c++;if(resp(l))by[r].r++;if(est(l)==='cliente')by[r].k++});
  const rows=Object.entries(by).sort((a,b)=>b[1].c-a[1].c||b[1].t-a[1].t);
  h+='<div class="sec"><h3>Por rubro</h3><div class="tbl-wrap"><table><thead><tr><th>Rubro</th><th>Locales</th><th>Contact.</th><th>Resp.</th><th>%</th><th>Clientes</th></tr></thead><tbody>'+
   rows.map(([r,v])=>'<tr><td>'+esc(r)+'</td><td>'+v.t+'</td><td>'+v.c+'</td><td>'+v.r+'</td><td>'+pct(v.r,v.c)+'</td><td>'+v.k+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h;
}
function chartDias(ls){
  const days=[];const t0=new Date();t0.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(t0.getTime()-i*DAY);days.push({d,n:0})}
  ls.forEach(l=>(l.hist||[]).forEach(x=>{if(x.tipo!=='envio')return;const dd=new Date(x.t);dd.setHours(0,0,0,0);const f=days.find(o=>o.d.getTime()===dd.getTime());if(f)f.n++}));
  const max=Math.max(1,...days.map(o=>o.n));
  const nice=[1,2,5,10,20,25,50,100,200,500,1000].find(v=>v>=max)||max;
  const W=340,H=150,pl=28,pb=22,pt=14,cw=(W-pl-6)/14,ch=H-pb-pt;
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ch-(ch*f);g+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-5)+'" y="'+(y+3.5).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+(Math.round(nice*f*10)/10)+'</text>'});
  days.forEach((o,i)=>{const x=pl+i*cw+cw*.18,w=cw*.64,h=ch*o.n/nice,y=pt+ch-h;
    if(o.n)g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+(i===13?'var(--accent)':'var(--s-enviado)')+'"/><text x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+o.n+'</text>';
    if(i%2===1||i===13)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" font-size="9.5" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono,monospace">'+(i===13?'hoy':o.d.getDate())+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mensajes enviados por día">'+g+'</svg>';
}

async function sugerir(q){

function parseCoords(t){
  t=String(t||'');let m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/);
  return m?{lat:parseFloat(m[1]),lng:parseFloat(m[2])}:null;
}
function parseImport(txt){
  txt=txt.trim();if(!txt)return [];
  if(/^[\[{]/.test(txt)){let j=JSON.parse(txt);if(!Array.isArray(j))j=j.locales||[j];return j}
  const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':(txt.split('\n')[0].includes('\t')?'\t':',');
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'&&txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else if(ch==='"')q=false;else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push('');else if(ch==='\n'){rows.push(cur);cur=['']}else if(ch!=='\r')cur[cur.length-1]+=ch}
  rows.push(cur);
  const hd=rows.shift().map(h=>h.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hd.map((h,i)=>[h,(r[i]||'').trim()])));
}
function normRow(o){
  const g=(...ks)=>{for(const k of ks){if(o[k]!=null&&o[k]!=='')return o[k]}return ''};
  const lat=parseFloat(g('lat','latitud','latitude')),lng=parseFloat(g('lng','lon','long','longitud','longitude'));
  return {nombre:String(g('nombre','name','local','negocio')),rubro:String(g('rubro','categoria','category','tipo')),direccion:String(g('direccion','address','domicilio')),
    tel:String(g('tel','telefono','phone','whatsapp','celular')),lat:isFinite(lat)?lat:null,lng:isFinite(lng)?lng:null,zona:String(g('zona','barrio','localidad','ciudad')),web:String(g('web','sitio','website'))};
}

  let arr;try{arr=parseImport(S.importTxt)}catch(e){toast('No pude leer el texto: revisá que sea CSV o JSON válido.');return}
  const keyOf=l=>normTel(l.tel)||((l.nombre||'')+'|'+(l.direccion||'')).toLowerCase();
  const seen=new Set(locales().map(keyOf));let n=0,rep=0;
  for(const o of arr){const l=normRow(o);if(!l.nombre){continue}const k=keyOf(l);if(seen.has(k)){rep++;continue}seen.add(k);
    l.estado='nuevo';l.creado=Date.now();l.hist=[];write('locales',uid('l'),l);n++;
  }
  S.importTxt='';toast(n+' locales importados'+(rep?' · '+rep+' repetidos salteados':''));S.tab='locales';render();
}
async function copyFrom(text,srcId){
  try{await navigator.clipboard.writeText(text);toast('Copiado')}catch(e){const el=srcId&&document.getElementById(srcId);if(el&&el.select){el.focus();el.select()}toast('Seleccioné el texto: copialo con el menú del teléfono')}
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.id==='sheet'){S.sheet=null;render()}return}
  const a=el.dataset.act,id=el.dataset.id;
  if(a!=='delLocal'&&a!=='delPl'&&a!=='wipe')S.confirm=null;
  switch(a){
   case 'tab':S.tab=el.dataset.t;S.sheet=null;render();$('#view').scrollTop=0;break;
   case 'vista':S.vista=el.dataset.v;render();break;
   case 'verF':S.verFiltros=!S.verFiltros;render();break;
   case 'open':openSheet(id);break;
   case 'close':S.sheet=null;render();break;
   case 'goFiltro':S.tab='locales';S.fEstado=el.dataset.e;S.vista='lista';render();break;
   case 'setEst':{const l=clone(data.locales[S.sheet]),e=el.dataset.e;if(est(l)!==e){addHist(l,'estado',EL[est(l)]+' → '+EL[e]);l.estado=e;write('locales',S.sheet,l)}break}
   case 'shSent':if(!S.sheetMsg.trim()){toast('Escribí el mensaje primero');break}registrarEnvio(S.sheet,S.sheetMsg);toast('Registrado como enviado');break;
   case 'addResp':case 'addNota':{const t=S.nota.trim();if(!t&&a==='addNota'){toast('Escribí la nota primero');break}
     const l=clone(data.locales[S.sheet]);addHist(l,a==='addResp'?'respuesta':'nota',t);if(a==='addResp'&&['nuevo','enviado'].includes(est(l)))l.estado='respondio';l.notaUlt=t.slice(0,80);
     write('locales',S.sheet,l);S.nota='';toast(a==='addResp'?'Respuesta registrada':'Nota guardada');break}
   case 'saveEdit':{const E=S.edit,l=clone(data.locales[S.sheet]);['nombre','rubro','zona','direccion','tel','web'].forEach(k=>l[k]=String(E[k]||'').trim());
     const la=parseFloat(String(E.lat).replace(',','.')),ln=parseFloat(String(E.lng).replace(',','.'));l.lat=isFinite(la)?la:null;l.lng=isFinite(ln)?ln:null;
     write('locales',S.sheet,l);S.edit=null;toast('Datos guardados');break}
   case 'delLocal':if(S.confirm!=='delLocal'){S.confirm='delLocal';render();break}del('locales',S.sheet);S.sheet=null;S.confirm=null;toast('Local eliminado');render();break;
   case 'newPl':S.editPl='new';S.plNombre='';S.plTexto='{saludo}, ¿cómo están en {nombre}? ';render();break;
   case 'editPl':{const p=data.plantillas[id];S.editPl=id;S.plNombre=p.nombre||'';S.plTexto=p.texto||'';render();$('#view').scrollTop=0;break}
   case 'cancelPl':S.editPl=null;render();break;
   case 'savePl':{if(!S.plTexto.trim()){toast('El mensaje está vacío');break}const pid=S.editPl==='new'?uid('p'):S.editPl;write('plantillas',pid,{nombre:S.plNombre.trim()||'Plantilla',texto:S.plTexto});if(!S.camp.pl)S.camp.pl=pid;S.editPl=null;toast('Plantilla guardada');render();break}
   case 'delPl':if(S.confirm!=='delPl'){S.confirm='delPl';render();break}del('plantillas',S.editPl);if(S.camp.pl===S.editPl)S.camp.pl='';S.editPl=null;S.confirm=null;toast('Plantilla eliminada');render();break;
   case 'insVar':{const ta=$('#plTexto'),v='{'+el.dataset.v+'}';const s=ta.selectionStart??ta.value.length,e2=ta.selectionEnd??s;S.plTexto=ta.value.slice(0,s)+v+ta.value.slice(e2);render();const t2=$('#plTexto');t2.focus();t2.setSelectionRange(s+v.length,s+v.length);break}
   case 'startCamp':{const c=S.camp,cand=colaCandidatos().con;if(!cand.length)break;c.cola=cand.map(l=>l.id);c.i=0;c.enviados=0;c.msg=fill(data.plantillas[c.pl].texto,cand[0]);render();$('#view').scrollTop=0;break}
   case 'campSent':case 'campSkip':{const c=S.camp,cid=c.cola[c.i];if(a==='campSent'){registrarEnvio(cid,c.msg);c.enviados++}
     c.i++;const nx=data.locales[c.cola[c.i]];c.msg=nx?fill(data.plantillas[c.pl]?.texto,{id:c.cola[c.i],...nx}):'';render();$('#view').scrollTop=0;break}
   case 'endCamp':S.camp.cola=null;render();break;
   case 'copy':{const s=document.getElementById(el.dataset.src);copyFrom(s?s.value:'',el.dataset.src);break}
   case 'copyTxt':copyFrom(el.dataset.txt);break;
   case 'saveBase':{const nom=S.baseNombre??data.config.baseNombre??'',t=S.baseTxt.trim(),p=parseCoords(t),b=base();
     if(p){setBase(p.lat,p.lng,nom);break}
     if(!t){if(b)setBase(b.lat,b.lng,nom);else toast('Escribí una dirección o pegá coordenadas');break}
     toast('Buscando la dirección…');
     nomi('search?q='+encodeURIComponent(t)+'&countrycodes=ar&limit=1').then(j=>{if(!j.length){toast('No encontré esa dirección. Probá con calle, altura y localidad.');return}setBase(+(+j[0].lat).toFixed(6),+(+j[0].lon).toFixed(6),nom||t)}).catch(()=>toast('No se pudo buscar. Revisá la conexión.'));break}
   case 'baseGps':gps((la,ln)=>setBase(+la.toFixed(6),+ln.toFixed(6),S.baseNombre??data.config.baseNombre??'Mi ubicación'));break;
   case 'toMap':S.sheet=null;S.tab='locales';S.vista='mapa';S.focus=id;render();break;
   case 'export':{const blob=new Blob([JSON.stringify({app:'radar-locales',v:1,exportado:new Date().toISOString(),...data},null,1)],{type:'application/json'});
     const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='radar-locales-'+hoy()+'.json';document.body.appendChild(a2);a2.click();setTimeout(()=>{URL.revokeObjectURL(a2.href);a2.remove()},1000);break}
   case 'saveFirma':write('config','app',Object.assign(clone(data.config),{firma:(S.firma??'').trim()}));S.firma=null;toast('Firma guardada');break;
   case 'import':doImport();break;
   case 'wipe':if(S.confirm!=='wipe'){S.confirm='wipe';render();break}Object.keys(data.locales).forEach(k=>del('locales',k));S.confirm=null;toast('Locales borrados');break;
  }
});
document.addEventListener('toggle',ev=>{if(ev.target.tagName==='DETAILS'&&ev.target.open&&!S.edit&&S.sheet){const l=data.locales[S.sheet];S.edit={nombre:l.nombre,rubro:l.rubro,zona:l.zona,direccion:l.direccion,tel:l.tel,lat:l.lat??'',lng:l.lng??'',web:l.web};render()}else if(ev.target.tagName==='DETAILS'&&!ev.target.open&&S.edit){S.edit=null}},true);
document.addEventListener('input',ev=>{
  const el=ev.target,m=el.dataset&&el.dataset.model;if(!m)return;
  setPath(m,el.value);
  if(el.dataset.live!==undefined)render();
  if(el.dataset.prev){const pv=document.getElementById(el.dataset.prev);if(pv)pv.textContent=fill(el.value,locales()[0]||{nombre:'Kiosco Don Pepe',rubro:'Kiosco',direccion:'Av. Rivadavia 1234',zona:'Centro'})}
  if(el.dataset.wa){const w=document.getElementById(el.dataset.wa);const lid=el.dataset.wa==='shWa'?S.sheet:S.camp.cola&&S.camp.cola[S.camp.i];const l=data.locales[lid];if(w&&l)w.href=waUrl(l,el.value)}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='bk'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o.locales!=='object'||Array.isArray(o.locales))throw 0;
      Object.assign(data.locales,o.locales);Object.assign(data.plantillas,o.plantillas||{});if(o.config&&!base())data.config=Object.assign(clone(data.config),o.config);saveLocal();render();toast('Copia restaurada: '+Object.keys(o.locales).length+' locales')}
    catch(e){toast('Ese archivo no es una copia de Radar de Locales')}el.value=''};fr.readAsText(el.files[0]);return}
  if(el.dataset.render!==undefined){setPath(el.dataset.model,el.value);render();return}
  const a=el.dataset.actChange;
  if(a==='setProx'){const l=clone(data.locales[S.sheet]);l.proximo=el.value;write('locales',S.sheet,l);toast(el.value?'Seguimiento agendado':'Seguimiento quitado')}
  if(a==='shPl'){S.sheetPl=el.value;S.sheetMsg=fill(data.plantillas[el.value].texto,{id:S.sheet,...data.locales[S.sheet]});render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;render()}});

loadLocal();render();
$('#mapSearch').addEventListener('submit',ev=>{ev.preventDefault();$('#mq').blur();buscar($('#mq').value)});
$('#mq').addEventListener('input',ev=>{const q=ev.target.value.trim();clearTimeout(acT);if(acCtl)acCtl.abort();if(q.length<3){$('#results').hidden=true;return}acT=setTimeout(()=>sugerir(q),300)});
$('#layBtn').addEventListener('click',()=>{const p=$('#lpanel'),open=p.hidden;if(open)panelCapas();p.hidden=!open;$('#layBtn').setAttribute('aria-expanded',open)});
$('#lpanel').addEventListener('click',ev=>{const b=ev.target.closest('[data-capa]');if(b){setCapa(b.dataset.capa);$('#lpanel').hidden=true;$('#layBtn').setAttribute('aria-expanded','false')}});$('#meBtn').addEventListener('click',()=>gps((la,ln)=>{meLL=[la,ln];syncMap(filtrados());map.setView(meLL,17)}));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
